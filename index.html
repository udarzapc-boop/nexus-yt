<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_TUBE // Bypass Stream Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #060913;
            color: #e2e8f0;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(13, 18, 36, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card {
            background: rgba(22, 30, 56, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(0, 243, 255, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 243, 255, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #060913; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- TOP NAVIGATION -->
    <header class="sticky top-0 z-40 glass-panel border-b border-cyan-500/20 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="loadCategory('trending')">
                <div class="p-2 bg-cyan-500/10 border border-cyan-400/30 rounded-xl text-cyan-400">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <span class="cyber-font font-bold text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-pink-500">
                    CYBER<span class="text-white">_HUB</span>
                </span>
            </div>

            <!-- Search Bar -->
            <form onsubmit="handleSearch(event)" class="flex-1 max-w-2xl relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search video name or paste ID..." 
                    class="w-full bg-slate-950/90 border border-cyan-500/30 rounded-full py-2.5 pl-11 pr-24 text-sm text-cyan-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-all"
                >
                <i data-lucide="search" class="w-5 h-5 absolute left-4 top-3 text-slate-400"></i>
                <button type="submit" class="absolute right-1.5 top-1.5 px-4 py-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/40 text-cyan-300 rounded-full text-xs font-semibold uppercase transition-all">
                    Search
                </button>
            </form>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

        <!-- PLAYER SECTION (Using proxy embed instead of youtube-nocookie) -->
        <section id="playerContainer" class="hidden space-y-4">
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden glass-panel border border-cyan-500/40 bg-black">
                <iframe 
                    id="mainPlayer" 
                    class="w-full h-full border-0" 
                    allowfullscreen 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
            
            <div class="flex items-center justify-between p-4 glass-panel rounded-2xl">
                <div>
                    <h1 id="playerTitle" class="text-lg font-bold text-white">Stream Active</h1>
                    <p id="playerAuthor" class="text-xs text-cyan-400 mt-1">Bypass Tunnel Connected</p>
                </div>
                <button onclick="closePlayer()" class="px-4 py-2 bg-slate-800 hover:bg-red-500/20 text-slate-300 hover:text-red-400 rounded-xl text-xs font-semibold transition-all">
                    Close Player
                </button>
            </div>
        </section>

        <!-- VIDEO GRID -->
        <section id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamic Cards -->
        </section>

    </main>

    <!-- SCRIPT -->
    <script>
        lucide.createIcons();

        // Proxy embed nodes (No youtube domain used directly)
        const PROXY_EMBED_NODES = [
            "https://piped.video/embed/",
            "https://inv.tux.pizza/embed/",
            "https://invidious.drgns.space/embed/"
        ];
        let currentNodeIdx = 0;

        const videoGrid = document.getElementById('videoGrid');
        const playerContainer = document.getElementById('playerContainer');
        const mainPlayer = document.getElementById('mainPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const playerAuthor = document.getElementById('playerAuthor');

        const sampleVideos = [
            { id: 'jfKfPfyJRdk', title: 'Lofi Hip Hop Radio - Beats to Study/Relax', author: 'Lofi Girl' },
            { id: '5qap5aO4i9A', title: 'Lofi Beats to Sleep / Chill', author: 'Chill Station' },
            { id: 'DWcJFNfaw9c', title: 'Cyberpunk Synthwave Coding Mix', author: 'Synthwave Radio' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderVideos(sampleVideos);
        });

        function renderVideos(items) {
            videoGrid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl overflow-hidden cursor-pointer group flex flex-col";
                card.onclick = () => playVideo(item.id, item.title, item.author);

                const thumb = `https://images.weserv.nl/?url=i.ytimg.com/vi/${item.id}/hqdefault.jpg`;

                card.innerHTML = `
                    <div class="relative aspect-video w-full overflow-hidden bg-slate-950">
                        <img src="${thumb}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                        <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <div class="p-3 bg-cyan-500 text-black rounded-full shadow-lg">
                                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                        <h3 class="text-sm font-semibold text-slate-100 line-clamp-2">${item.title}</h3>
                        <p class="text-xs text-slate-400">${item.author}</p>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            videoGrid.innerHTML = `<div class="col-span-full text-center py-10 text-cyan-400 font-mono">SEARCHING_BYPASS_NODES...</div>`;

            try {
                const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
                const data = await res.json();
                if (data && data.items) {
                    const formatted = data.items.map(i => ({
                        id: i.url ? i.url.replace('/watch?v=', '') : '',
                        title: i.title,
                        author: i.uploaderName || 'Creator'
                    })).filter(i => i.id);
                    renderVideos(formatted);
                }
            } catch (err) {
                videoGrid.innerHTML = `<div class="col-span-full text-center py-10 text-red-400 font-mono">Search error. Try preset streams.</div>`;
            }
        }

        function playVideo(id, title, author) {
            playerTitle.innerText = title;
            playerAuthor.innerText = author;

            mainPlayer.src = `${PROXY_EMBED_NODES[currentNodeIdx]}${id}?autoplay=1`;
            
            playerContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            mainPlayer.src = '';
            playerContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
